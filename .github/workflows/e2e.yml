name: E2E

on:
  workflow_call:
    inputs:
        repo:
          required: true
          type: string
        artifacts:
          required: false
          type: string

env:
  GO_REQUIRED_MIN_VERSION: ''

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install DevSpace
        uses: loft-sh/setup-devspace@main

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod/go.sum are in submodules, not the repo root
          go-version: "1.27"
          cache-dependency-path: "**/go.sum"
      # Several add-ons start multiple kind clusters on one runner. The default
      # inotify limits are too low for that, and nodes fail to boot with
      # "could not find a log line that matches Reached target Multi-User System".
      - name: Raise inotify limits
        run: |
          sudo sysctl -w fs.inotify.max_user_watches=524288
          sudo sysctl -w fs.inotify.max_user_instances=512

      # kueue-addon creates its own hub and spoke clusters in build/setup-env.sh,
      # so the default cluster would only use up runner resources.
      - name: Setup kind
        if: inputs.repo != 'kueue-addon'
        run: kind create cluster --wait 300s

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.14.0'

      - name: Install Clusteradm
        run: |
          go install open-cluster-management.io/clusteradm/cmd/clusteradm@latest

      - name: Set KUBECONFIG
        run: |
          mkdir -p /home/runner/.kube

      - name: Free Disk Space
        run: |
          echo "Disk usage before cleanup:"
          df -h / | grep -E '^Filesystem|^/dev/root'

          # Remove Android SDK to free ~10GB
          sudo rm -rf /usr/local/lib/android

          echo "Disk usage after cleanup:"
          df -h / | grep -E '^Filesystem|^/dev/root'

      - name: Test E2E
        run: |
          cd ${{ inputs.repo }} && make test-e2e
        env:
          KUBECONFIG: /home/runner/.kube/config

      - name: Upload Artifacts
        if: |
          (success() || failure()) && inputs.artifacts != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ inputs.repo }}
          path: ${{ inputs.artifacts }}
          if-no-files-found: ignore
          retention-days: 7
